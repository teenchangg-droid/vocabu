<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="종료타이머">
<link rel="apple-touch-icon" href="icon-180.png">
<title>종료 N분 전 타이머</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecef;--panel:#f7f9fa;--ink:#13181d;--sub:#56616b;--line:#b9c3cc;--acc:#1d3a5f;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1215;--panel:#171d22;--ink:#e7ecf0;--sub:#93a0ab;--line:#2c363e;--acc:#9bbbe6;--accink:#0e1215}}
:root[data-theme="dark"]{--bg:#0e1215;--panel:#171d22;--ink:#e7ecf0;--sub:#93a0ab;--line:#2c363e;--acc:#9bbbe6;--accink:#0e1215}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",serif;min-height:100vh;display:flex;justify-content:center;padding:20px 16px}
main{width:100%;max-width:460px}
h1{font-size:1rem;font-weight:500;color:var(--sub);margin:8px 0 14px;letter-spacing:.02em}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 20px 18px}
.say{font-size:1.05rem;min-height:1.6em;margin:0 0 4px;color:var(--sub)}
.say b{color:var(--ink)}
.time{font-weight:700;font-size:clamp(3.4rem,20vw,5.6rem);white-space:nowrap;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:0}
.time small{font-size:.9rem;font-weight:500;color:var(--sub);margin-left:6px;letter-spacing:0}
.bar{height:4px;background:var(--line);margin:16px 0 20px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--acc);transform-origin:left}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:.92rem;color:var(--sub)}
input[type=number]{width:5.2em;font:inherit;font-size:1.1rem;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-size:1rem;padding:11px 18px;border-radius:4px;border:1px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer}
button.main{background:var(--acc);color:var(--accink);flex:1;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row+.row{margin-top:12px}
.sub{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem;color:var(--sub);line-height:1.6}
.sub label{display:flex;gap:10px;align-items:center;margin-top:8px}.sub input[type=range]{flex:1;accent-color:var(--acc)}.sub select{flex:1;min-width:0;font:inherit;padding:6px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.sub input[type=file]{display:block;margin-top:8px;max-width:100%;font-size:.85rem;color:var(--sub)}
</style>
</head>
<body>
<main>
<h1>종료 N분 전 타이머</h1>
<section class="sheet">
<p class="say" id="say" aria-live="polite">시간을 정하고 시작하세요</p>
<p class="time"><span id="time">10:00</span><small id="ot"></small></p>
<div class="bar"><i id="bar"></i></div>
<div class="row"><label for="min">시험 시간(분)</label><input id="min" type="number" min="1" max="999" value="10" inputmode="numeric"></div>
<div class="row"><button class="main" id="go">시작</button><button id="reset">초기화</button><button id="demo">예시 듣기</button></div>
<div class="sub">“N분”만 기기의 한국어 여성 음성으로 읽고, “종료”와 “전입니다”는 평가원 음원을 씁니다. 높낮이와 속도를 조절해 맞춰 보세요.
<label>높낮이 <input type="range" id="pitch" min="0.5" max="1.5" step="0.05" value="0.95"></label>
<label>속도 <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="0.8"></label>
<label>음성 <select id="voice"><option value="">자동(여성)</option></select></label>
<label>기계음 볼륨 <input type="range" id="vol" min="0.2" max="1" step="0.05" value="1"></label>
<label>녹음 볼륨 <input type="range" id="rvol" min="0.2" max="1" step="0.05" value="1"></label>
<label>전입니다 앞부분 볼륨 <input type="range" id="boost" min="1" max="2.5" step="0.1" value="1.6"></label>
<label>종료→숫자 간격(왼쪽이 짧음) <input type="range" id="lead" min="0.1" max="0.9" step="0.05" value="0.45"></label>
<label>숫자→전입니다 간격(왼쪽이 짧음) <input type="range" id="gap2" min="-0.6" max="0.5" step="0.05" value="-0.1"></label>
</div>
</section>
</main>

const $=id=>document.getElementById(id);
const pre=new Audio(PRE),post=new Audio(POST),custom={};
const D=['','일','이','삼','사','오','육','칠','팔','구'];
function sino(n){if(n>=100)return(n>=200?D[Math.floor(n/100)]:'')+'백'+(n%100?sino(n%100):'');if(n>=10)return(n>=20?D[Math.floor(n/10)]:'')+'십'+D[n%10];return D[n]}
const playA=(a,s=0)=>new Promise(r=>{let d=false;const f=()=>{if(!d){d=true;r()}};a.currentTime=s;a.onended=f;a.onerror=f;a.play().catch(()=>{$('say').textContent='소리가 재생되지 않아요. 무음 모드와 볼륨을 확인하세요';f()});setTimeout(f,4500)});
function fillVoices(){if(!('speechSynthesis' in window))return;const s=$('voice'),cur=s.value;const ko=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('ko'));s.innerHTML='';const o=document.createElement('option');o.value='';o.textContent='자동(여성)';s.appendChild(o);ko.forEach(v=>{const p=document.createElement('option');p.value=v.name;p.textContent=v.name;s.appendChild(p)});s.value=cur||savedVoice}
function pickVoice(){const sel=$('voice').value;if(sel){const m=speechSynthesis.getVoices().find(v=>v.name===sel);if(m)return m}const ko=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('ko'));return ko.find(v=>/yuna|heami|sunhi|seoyeon|유나|선희|google/i.test(v.name))||ko.find(v=>!/injoon|male|인준/i.test(v.name))||ko[0]}
let perSyl=.22;
function speak(t,cb){return new Promise(r=>{if(!('speechSynthesis' in window))return r();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';const v=pickVoice();if(v)u.voice=v;u.pitch=+$('pitch').value;u.rate=+$('rate').value;u.volume=+$('vol').value;u.onstart=()=>{cb&&cb()};u.onend=r;u.onerror=r;speechSynthesis.speak(u);setTimeout(r,3500)})}
let busy=Promise.resolve();
function announce(n){busy=busy.then(async()=>{$('say').innerHTML='<b>종료 '+n+'분 전입니다</b>';pre.volume=post.volume=+$('rvol').value;const txt=sino(n)+'분',rt=+$('rate').value;let t0=0,pp=null;const go=()=>{const e=txt.length*perSyl/rt*1000+(+$('gap2').value*1000);pp=new Promise(r=>setTimeout(r,Math.max(0,e))).then(playPost)};const st=()=>{t0=performance.now();go()};const pd=playA(pre);let sp=null;const t=setTimeout(()=>{sp=speak(txt,st)},+$('lead').value*1000);await pd;clearTimeout(t);if(!sp)sp=speak(txt,st);await sp;if(!pp)go();if(t0){perSyl=Math.min(.5,Math.max(.1,.5*perSyl+.5*((performance.now()-t0)/1000/txt.length*rt)))}await pp});return busy}
let ac=null,postBuf=null;
function b64buf(u){const s=atob(u.split(',')[1]),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a.buffer}
function playPost(){return new Promise(r=>{if(!ac||!postBuf)return playA(post,.16).then(r);const s=ac.createBufferSource(),g=ac.createGain(),c=ac.createDynamicsCompressor(),v=+$('rvol').value,b=+$('boost').value,t=ac.currentTime+.01;s.buffer=postBuf;g.gain.setValueAtTime(v*b,t);g.gain.setValueAtTime(v*b,t+.15);g.gain.linearRampToValueAtTime(v,t+.18);s.connect(g);g.connect(c);c.connect(ac.destination);s.onended=r;s.start(t,.16);setTimeout(r,3000)})}
function unlock(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();if(!postBuf)ac.decodeAudioData(b64buf(POST)).then(b=>postBuf=b).catch(()=>{})}catch(e){}const ps=[pre,post].map(a=>{a.muted=true;return a.play().then(()=>{a.pause();a.currentTime=0}).catch(()=>{}).then(()=>{a.muted=false})});try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}return Promise.all(ps)}
let end=0,remMs=0,totalMs=0,timer=null,lastM=null,state='idle',over=false;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function draw(ms){const s=Math.max(0,Math.ceil(ms/1000));$('time').textContent=fmt(s);$('bar').style.transform='scaleX('+(totalMs?Math.max(0,ms/totalMs):1)+')'}
function tick(){const rem=end-Date.now();if(rem<=0){if(!over){over=true;remMs=0;draw(0);pre.volume=+$('rvol').value;busy=busy.then(()=>playA(pre));$('say').innerHTML='<b>종료</b>'}$('ot').textContent='+'+fmt(Math.floor(-rem/1000));return}
remMs=rem;draw(rem);const s=Math.ceil(rem/1000);if(s%60===0&&s<totalMs/1000&&s/60!==lastM){lastM=s/60;announce(lastM)}}
$('go').onclick=()=>{unlock();if(state==='run'){clearInterval(timer);if(over){state='idle';over=false;$('go').textContent='시작';return}state='pause';$('go').textContent='계속';return}
if(state!=='pause'){const m=Math.max(1,Math.min(999,parseInt($('min').value)||1));totalMs=remMs=m*60000;lastM=null;over=false;$('ot').textContent='';$('say').textContent='진행 중'}
end=Date.now()+remMs;state='run';$('go').textContent='일시정지';clearInterval(timer);timer=setInterval(tick,200);tick()};
$('reset').onclick=()=>{clearInterval(timer);state='idle';over=false;$('ot').textContent='';totalMs=0;lastM=null;$('go').textContent='시작';$('say').textContent='시간을 정하고 시작하세요';draw((parseInt($('min').value)||1)*60000)};
$('min').oninput=()=>{if(state==='idle'){totalMs=0;draw((parseInt($('min').value)||1)*60000)}};
$('demo').onclick=()=>{unlock().then(()=>announce(5))};
$('say').textContent=$('say').textContent;
let savedVoice='';const CTL=['min','pitch','rate','voice','vol','rvol','boost','lead','gap2'];
function saveS(){try{const o={};CTL.forEach(i=>o[i]=$(i).value);localStorage.setItem('examTimer',JSON.stringify(o))}catch(e){}}
function loadS(){try{const o=JSON.parse(localStorage.getItem('examTimer')||'{}');CTL.forEach(i=>{if(o[i]===undefined)return;if(i==='voice')savedVoice=o[i];else $(i).value=o[i]})}catch(e){}}
loadS();
document.querySelectorAll('.sub input[type=range]').forEach(e=>{const s=document.createElement('span');s.style.minWidth='2.8em';s.style.textAlign='right';e.parentNode.appendChild(s);const u=()=>{s.textContent=e.value};e.addEventListener('input',u);u()});
document.querySelectorAll('.sub input,.sub select,#min').forEach(e=>{e.addEventListener('input',saveS);e.addEventListener('change',saveS)});
draw((parseInt($('min').value)||10)*60000);fillVoices();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=fillVoices;
</script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let wl=null;async function keepOn(){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.getElementById('go').addEventListener('click',keepOn);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state==='run')keepOn()});
</script>
